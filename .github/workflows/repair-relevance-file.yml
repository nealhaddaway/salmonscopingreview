name: Repair relevance screening file

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Restore relevance_screening.R and use RSPM'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Restore and patch relevance_screening.R
        run: |
          set -euo pipefail
          git checkout d6f4cec28f6b11f63f63e56638553c161d07301c -- R/relevance_screening.R
          python3 - <<'PY'
          from pathlib import Path
          p = Path('R/relevance_screening.R')
          s = p.read_text()
          old = '''    install.packages(\n      missing,\n      repos = "https://cloud.r-project.org"\n    )'''
          new = '''    rspm <- Sys.getenv("RSPM", "")\n    repos <- if (nzchar(rspm)) rspm else "https://cloud.r-project.org"\n\n    install.packages(\n      missing,\n      repos = repos,\n      Ncpus = max(1L, min(4L, parallel::detectCores(logical = TRUE)))\n    )'''
          if old not in s:
              raise SystemExit('Expected install.packages block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit repaired file
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add R/relevance_screening.R
          git commit -m 'Restore relevance_screening.R and use RSPM'
          git push
