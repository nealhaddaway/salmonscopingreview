name: Master exclusion LLM adjudication

on:
  workflow_dispatch:

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/R
          key: ${{ runner.os }}-r-4.4-llm-adjudication-v1

      - name: Install R dependencies
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'options(repos=c(CRAN="https://cloud.r-project.org")); pkgs <- c("dplyr","readr","jsonlite","httr2","tibble"); missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly=TRUE)]; if(length(missing)) install.packages(missing)'

      - name: Download successful master audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/master_relevance_audit
          gh run download 31871194556 \
            --repo "${{ github.repository }}" \
            --name master-relevance-audit \
            --dir outputs/master_relevance_audit
          test -f outputs/master_relevance_audit/master_automatic_excludes.csv
          n=$(tail -n +2 outputs/master_relevance_audit/master_automatic_excludes.csv | wc -l)
          echo "Automatic exclusions downloaded: ${n}"
          test "${n}" -eq 79

      - name: Run LLM adjudication
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          Rscript scripts/65_llm_adjudicate_master_excludes.R \
            outputs/master_relevance_audit/master_automatic_excludes.csv \
            outputs/master_relevance_audit/master_automatic_excludes_llm_adjudication.csv

      - name: Validate adjudication output
        shell: bash
        run: |
          set -euo pipefail
          test -s outputs/master_relevance_audit/master_automatic_excludes_llm_adjudication.csv
          n=$(tail -n +2 outputs/master_relevance_audit/master_automatic_excludes_llm_adjudication.csv | wc -l)
          echo "Adjudicated rows: ${n}"
          test "${n}" -eq 79

      - name: Upload adjudication results
        uses: actions/upload-artifact@v4
        with:
          name: master-exclusion-llm-adjudication
          path: outputs/master_relevance_audit/master_automatic_excludes_llm_adjudication.csv
          if-no-files-found: error
