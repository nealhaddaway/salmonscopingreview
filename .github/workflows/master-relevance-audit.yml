name: Master relevance audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch screening inputs from LivingEvidenceMap
        shell: bash
        env:
          LIVING_EVIDENCE_MAP_TOKEN: ${{ secrets.LIVING_EVIDENCE_MAP_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data_raw outputs/stage_5_relevance_screening/model
          BASE='https://raw.githubusercontent.com/thesalmonandthetomato/LivingEvidenceMap/main/data/reference'
          AUTH=(-H "Authorization: Bearer ${LIVING_EVIDENCE_MAP_TOKEN}")
          curl -L --fail --retry 3 --retry-delay 2 "${AUTH[@]}" "$BASE/INCLUDES%20fixed%20abstracts.txt" -o 'data_raw/INCLUDES fixed abstracts.txt'
          curl -L --fail --retry 3 --retry-delay 2 "${AUTH[@]}" "$BASE/salmon_farming_relevance_model.rds" -o 'outputs/stage_5_relevance_screening/model/salmon_farming_relevance_model.rds'
          test -s 'data_raw/INCLUDES fixed abstracts.txt'
          test -s 'outputs/stage_5_relevance_screening/model/salmon_farming_relevance_model.rds'
          echo "Corpus size: $(stat -c%s 'data_raw/INCLUDES fixed abstracts.txt') bytes"
          echo "Model size: $(stat -c%s 'outputs/stage_5_relevance_screening/model/salmon_farming_relevance_model.rds') bytes"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Configure R package library
        shell: bash
        run: |
          set -euo pipefail
          R_LIBS_USER="$HOME/R/x86_64-pc-linux-gnu-library/4.6"
          mkdir -p "$R_LIBS_USER"
          echo "R_LIBS_USER=$R_LIBS_USER" >> "$GITHUB_ENV"
          echo "R library: $R_LIBS_USER"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! dpkg-query -W -f='${Status}' libuv1-dev 2>/dev/null | grep -q 'install ok installed'; then
            sudo apt-get update
            sudo apt-get install -y libuv1-dev
          else
            echo 'libuv1-dev already installed'
          fi

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-4.6.1-relevance-packages-v1
          restore-keys: |
            ${{ runner.os }}-r-4.6.1-relevance-packages-

      - name: Report R package cache status
        shell: bash
        run: |
          set -euo pipefail
          Rscript -e 'cat("R library:\n", Sys.getenv("R_LIBS_USER"), "\nInstalled packages: ", nrow(installed.packages(lib.loc=Sys.getenv("R_LIBS_USER"))), "\n", sep="")'

      - name: Run master relevance audit
        env:
          TZ: UTC
        run: Rscript scripts/64_audit_master_relevance.R

      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: master-relevance-audit
          path: outputs/master_relevance_audit/
          if-no-files-found: error
