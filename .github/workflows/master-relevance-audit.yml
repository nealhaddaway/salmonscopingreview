name: Master relevance audit

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-4.6.1-relevance-${{ hashFiles('R/relevance_screening.R', 'scripts/64_audit_master_relevance.R') }}
          restore-keys: |
            ${{ runner.os }}-r-4.6.1-relevance-

      - name: Run master relevance audit
        env:
          TZ: UTC
        run: Rscript scripts/64_audit_master_relevance.R

      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: master-relevance-audit
          path: outputs/master_relevance_audit/
          if-no-files-found: error
