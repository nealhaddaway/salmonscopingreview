name: Master relevance audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch screening inputs from LivingEvidenceMap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data_raw outputs/stage_5_relevance_screening/model
          BASE='https://raw.githubusercontent.com/thesalmonandthetomato/LivingEvidenceMap/main/data/reference'
          curl -L --fail --retry 3 --retry-delay 2 "$BASE/INCLUDES%20fixed%20abstracts.txt" -o 'data_raw/INCLUDES fixed abstracts.txt'
          curl -L --fail --retry 3 --retry-delay 2 "$BASE/salmon_farming_relevance_model.rds" -o 'outputs/stage_5_relevance_screening/model/salmon_farming_relevance_model.rds'
          test -s 'data_raw/INCLUDES fixed abstracts.txt'
          test -s 'outputs/stage_5_relevance_screening/model/salmon_farming_relevance_model.rds'
          echo "Corpus size: $(stat -c%s 'data_raw/INCLUDES fixed abstracts.txt') bytes"
          echo "Model size: $(stat -c%s 'outputs/stage_5_relevance_screening/model/salmon_farming_relevance_model.rds') bytes"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-4.6.1-relevance-${{ hashFiles('R/relevance_screening.R', 'scripts/64_audit_master_relevance.R') }}
          restore-keys: |
            ${{ runner.os }}-r-4.6.1-relevance-

      - name: Run master relevance audit
        env:
          TZ: UTC
        run: Rscript scripts/64_audit_master_relevance.R

      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: master-relevance-audit
          path: outputs/master_relevance_audit/
          if-no-files-found: error
